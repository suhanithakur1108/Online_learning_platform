<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <i class="fa-solid fa-graduation-cap"></i> StudyHub
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'course_list' %}">Courses</a>
                </li>
                
                {% if user.is_authenticated %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'my_learning' %}">
                       <i class="fa-solid fa-book-open"></i></i> My Learning
                    </a>
                </li>
                {% endif %}
                
               
            <div class="d-flex gap-2 align-items-center">
                <!-- Dark Mode Toggle -->
                <button class="btn btn-link" id="darkModeToggle">
                    <i class="fa-solid fa-moon"></i>
                </button>
                
                {% if user.is_authenticated %}
                <div class="dropdown">
                    <button class="btn btn-link dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown">
                        {% if user.profile_picture %}
                            <img src="{{ user.profile_picture.url }}" class="rounded-circle" width="35" height="35">
                        {% else %}
                            <i class="fas fa-user-circle fa-2x"></i>
                        {% endif %}
                        <span>{{ user.first_name|default:user.username }}</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="{% url 'my_learning' %}">
                            <i class="fa-solid fa-book-open me-2"></i> My Learning
                        </a></li>
                        <li><a class="dropdown-item" href="{% url 'profile' %}">
                            <i class="fas fa-user me-2"></i> Profile
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="{% url 'logout' %}">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </a></li>
                    </ul>
                </div>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-primary">Login</a>
                <a href="{% url 'register' %}" class="btn btn-primary">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </div>
