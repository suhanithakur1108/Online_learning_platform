{% extends 'base.html' %}

{% block title %}Payment Success | StudyHub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow text-center">
                <div class="card-body p-4">
                    <i class="fas fa-check-circle text-success fa-4x mb-3"></i>
                    <h3>Payment Successful!</h3>
                    <p>You are now enrolled in <strong>{{ payment.course.title }}</strong></p>
                    <hr>
                    <a href="{% url 'my_learning' %}" class="btn btn-primary">Go to My Learning</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
